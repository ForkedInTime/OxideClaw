[package]
name = "oxideclaw"
version = "0.4.0"
edition = "2024"
# let-chains and several locked deps (ratatui 0.30, image, time, zip,
# self_update) need 1.88; README.md quotes this number and
# scripts/readme-lint.sh checks it.
rust-version = "1.88"
description = "Single-binary coding agent: zero-setup codebase index, cost-aware model routing, worktree agents, auto-fix loop, voice cloning. Claude, Ollama, and OpenAI-compatible backends."
license = "Apache-2.0"
repository = "https://github.com/ForkedInTime/OxideClaw"
keywords = ["cli", "ai", "coding-agent", "claude", "ollama"]
categories = ["command-line-utilities", "development-tools"]
# Keep the crates.io tarball small: images, CI, packaging, dev scripts and
# the SDK docs live on GitHub. Anything the binary embeds must live under src/.
# tests/release_workflow.rs include_str!s .github/, contrib/ and scripts/, so it
# only compiles in a git checkout and must not ship either.
exclude = ["assets/*", ".github/*", "contrib/*", "scripts/*", "sdk/*", ".kilocodeignore", "CLAUDE.md", ".secret/*", "tests/release_workflow.rs"]

[lib]
name = "oxideclaw"
path = "src/lib.rs"

[[bin]]
name = "oxideclaw"
path = "src/main.rs"

[dependencies]
# CLI argument parsing (replaces commander)
clap = { version = "4", features = ["derive", "env"] }

# Random number generation (spinner verbs, completion verbs)
rand = "0.9"

# Async runtime (replaces Node.js event loop)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "io-std", "signal"] }

# Async fn in trait objects (required for dyn Tool)
async-trait = "0.1"

# HTTP client for Anthropic API (replaces @anthropic-ai/sdk fetch calls)
# socks: SOCKS5 proxy support; rustls-tls: pure-Rust TLS (no openssl dep).
# rustls-tls-native-roots: also trust the OS store (or SSL_CERT_FILE/DIR), so a
# corporate TLS-inspecting proxy whose root is installed system-wide works.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "multipart", "rustls-tls", "rustls-tls-native-roots"] }

# SSE streaming for API responses
eventsource-stream = "0.2"
futures-util = "0.3"

# JSON serialization (replaces JSON.parse / zod)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling (replaces try/catch chains)
anyhow = "1"
thiserror = "2"

# Config / settings (replaces utils/config.ts)
config = "0.15"

# Glob pattern matching (replaces GlobTool)
glob = "0.3"

# Regex (replaces GrepTool)
regex = "1"

# Terminal colors (replaces chalk)
colored = "2"

# Recursive directory walking
walkdir = "2"
# Gitignore-aware walking for the code index
ignore = "0.4"

# HTML to plain text (for WebFetchTool)
html2text = "0.12"
# Decode fetched pages by their declared charset (cp1251, Shift_JIS, ...)
encoding_rs = "0.8"

# URL parsing
url = "2"

# Terminal UI (Phase 3 — replaces React/Ink)
# 0.30 for lru >= 0.18.2 (RUSTSEC-2026-0002, RUSTSEC-2026-0253). Defaults off:
# they add the calendar widget (and the `time` crate) and macros, unused here.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache", "unstable-rendered-line-info"] }
# Must match the crossterm ratatui's backend is built on (0.29), or the tree
# carries two copies.
crossterm = { version = "0.29", features = ["event-stream"] }

# Async event stream for crossterm
tokio-stream = "0.1"

# Cross-platform home directory (~)
dirs = "6"

# UUID for session/turn IDs
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local codebase RAG — tree-sitter AST parsing + SQLite FTS5 search
rusqlite = { version = "0.39", features = ["bundled"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"
clap_complete = "4.6.0"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "progress-bar", "archive-tar", "archive-zip", "compression-tar-gz", "checksums"] }
libc = "0.2"
tempfile = "3.27.0"

# CDP WebSocket client for browser automation
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# Filesystem watcher for watch mode
notify = "7"

# SHA-256 for loop detector page state fingerprinting
sha2 = "0.10"

# YAML parsing for enhanced skill frontmatter
serde_yaml = "0.9"

# Image processing for annotated screenshots
image = "0.25"

# Base64 encoding for screenshot data
base64 = "0.22"

# Job objects, so a Bash/PowerShell timeout or cancel kills the whole subtree
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# test-util enables `#[tokio::test(start_paused = true)]` so timeout-based tests
# (e.g. the SSE idle-stall guard) resolve instantly instead of sleeping in real time.
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros", "time"] }
