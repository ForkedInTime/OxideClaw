name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # clippy runs the full `cargo check` pass plus lints, so this replaces the
      # old bare `cargo check` rather than adding to it — same build, more
      # coverage, no extra CI time. `-D warnings` is the point: clippy was clean
      # but ungated, so nothing stopped it drifting back one PR at a time.
      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  readme-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README claims against source
        run: bash scripts/readme-lint.sh

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine
      - name: Build release binary
        run: cargo build --release --bin rustyclaw
      - name: Run perf smoke test
        run: bash scripts/perf-smoke.sh target/release/rustyclaw
