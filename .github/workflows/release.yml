name: Release

on:
  push:
    tags:
      - 'v*'          # triggers on v0.1.0, v1.0.0-beta.1, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# Each job asks for what it needs; the build jobs run third-party actions,
# pip packages and every crate's build script, so they get a read-only token
# and no OIDC.
permissions:
  contents: read

# Flow: build -> release (draft, SHA256SUMS, provenance attestations) ->
# smoke (run the draft's Linux x64 assets on old and new distros) -> publish.
# Users and docker.yml only ever see a release whose binaries started.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────
          # gnu builds link against a glibc 2.28 floor via cargo-zigbuild
          # (Ubuntu 20.04+, Debian 10+, RHEL 8+). Built against the runner's
          # own glibc they required GLIBC_2.39 and would not start on
          # Ubuntu 22.04, Debian 12 or RHEL 9.
          - target: x86_64-unknown-linux-gnu
            zigtarget: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            artifact: oxideclaw-linux-x64
            cross: false
            zig: true
          - target: aarch64-unknown-linux-gnu
            zigtarget: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            artifact: oxideclaw-linux-arm64
            cross: false
            zig: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: oxideclaw-linux-x64-musl
            cross: true

          # ── macOS ──────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os: macos-14          # Apple Silicon runner (cross-compiles to x86_64)
            artifact: oxideclaw-macos-x64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14          # Apple Silicon runner
            artifact: oxideclaw-macos-arm64
            cross: false

          # ── Windows ────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: oxideclaw-windows-x64.exe
            cross: false

    runs-on: ${{ matrix.os }}
    steps:
      # A manual dispatch runs on whatever branch was picked in the UI; build
      # the requested tag, not that branch's HEAD.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux gnu via cargo-zigbuild (glibc floor in matrix.zigtarget). A
      # venv because the runner's system Python refuses pip installs (PEP 668).
      - name: Install cargo-zigbuild (Linux gnu)
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.16.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      # zigbuild drops the `.2.28` suffix from the output directory, so the
      # binary still lands in target/<triple>/release.
      - name: Build release (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.zigtarget }}

      # Linux musl via cross (pinned so a release does not track git main)
      - name: Install cross (Linux musl)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # Native builds (macOS / Windows)
      - name: Build release (native)
        if: "!matrix.cross && !matrix.zig"
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ──────────────────────────────────────────────
      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/oxideclaw ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      # glibc refuses to load a binary that names any version it lacks, even
      # for weak symbols, so one stray GLIBC_2.39 reference breaks older hosts.
      - name: Check glibc floor (Linux gnu)
        if: matrix.zig
        run: |
          max=$(readelf -V ${{ matrix.artifact }} | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | tail -1)
          echo "highest glibc version required: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" != GLIBC_2.28 ]; then
            echo "::error::${{ matrix.artifact }} requires $max, above the GLIBC_2.28 floor"
            exit 1
          fi

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/oxideclaw.exe" "${{ matrix.artifact }}"

      # The static CRT comes from .cargo/config.toml; if it is ever lost, the
      # exe imports VCRUNTIME140.dll and fails to start without the redist.
      - name: Check static CRT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Select-String -Path "${{ matrix.artifact }}" -Pattern 'vcruntime140' -SimpleMatch -Quiet) {
            Write-Output "::error::${{ matrix.artifact }} imports VCRUNTIME140.dll (dynamic CRT)"
            exit 1
          }

      - name: Generate checksum (unix)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Generate checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release and upload its assets
      id-token: write      # OIDC token for the Sigstore signing certificate
      attestations: write  # store the provenance attestations
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # gh authenticates with GH_TOKEN

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create manifest
        run: |
          cd release
          cat > manifest.json <<'SCRIPT'
          {
            "platforms": {}
          }
          SCRIPT
          # Build proper manifest with jq
          echo '{}' > manifest.json
          for f in oxideclaw-*; do
            [[ "$f" == *.sha256 ]] && continue
            [[ ! -f "${f}.sha256" ]] && continue
            checksum=$(cut -d' ' -f1 < "${f}.sha256")
            jq --arg name "$f" --arg sum "$checksum" \
              '.[$name] = {"checksum": $sum}' manifest.json > tmp.json
            mv tmp.json manifest.json
          done
          # Wrap in platforms key
          jq '{platforms: .}' manifest.json > tmp.json
          mv tmp.json manifest.json
          cat manifest.json

      # One file to verify any download against (`sha256sum -c`). The
      # per-asset .sha256 sidecars stay: install.sh, npm, the Dockerfile and
      # the packaging script read them. Every sidecar must still match the
      # binary it travelled with before either is published.
      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          for sum in *.sha256; do
            bin=${sum%.sha256}
            want=$(cut -d' ' -f1 < "$sum" | tr -d '\r')
            got=$(sha256sum "$bin" | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then
              echo "::error::$bin hashes to $got but its sidecar says $want"
              exit 1
            fi
          done
          sums=$(sha256sum -- *)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

      # Signed SLSA provenance tying each binary's digest to this workflow
      # run; `gh attestation verify <file> --repo ForkedInTime/OxideClaw`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/oxideclaw-linux-x64
            release/oxideclaw-linux-arm64
            release/oxideclaw-linux-x64-musl
            release/oxideclaw-macos-x64
            release/oxideclaw-macos-arm64
            release/oxideclaw-windows-x64.exe

      - name: Determine tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # A draft is invisible to users, install.sh and self-update until the
      # publish job flips it. A full re-run first deletes the draft an earlier
      # attempt left, so the smoke jobs can only fetch this run's assets.
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # A hyphenated tag (v1.0.0-beta.1) must not become /releases/latest,
          # which install.sh and /upgrade resolve for every stable user.
          EXTRA=()
          if [[ "$TAG" == *-* ]]; then EXTRA=(--prerelease --latest=false); fi
          drafts() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"
          }
          for id in $(drafts); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # --verify-tag: never create a missing tag at the default branch tip.
          gh release create "$TAG" \
            --draft \
            --title "OxideClaw $TAG" \
            --generate-notes \
            --verify-tag \
            "${EXTRA[@]}" \
            release/*
          id=$(drafts)
          if [ "$(echo "$id" | wc -w)" != 1 ]; then
            echo "::error::expected one draft release for $TAG, found: $id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Downloads the draft's own assets (not the workflow artifacts), checks them
  # against SHA256SUMS and runs them. The gnu build targets glibc 2.28, so
  # Debian 10 and Rocky 8 (both exactly 2.28) prove the floor; the newer
  # images catch a regression like the GLIBC_2.39 one. Any failure leaves the
  # release a draft.
  smoke:
    name: smoke (${{ matrix.image }})
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # a draft release is visible only to a token with push access
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            asset: oxideclaw-linux-x64
          - image: debian:12
            asset: oxideclaw-linux-x64
          - image: rockylinux:9
            asset: oxideclaw-linux-x64
          - image: debian:10
            asset: oxideclaw-linux-x64
          - image: rockylinux:8
            asset: oxideclaw-linux-x64
          - image: alpine:3
            asset: oxideclaw-linux-x64-musl
    steps:
      - name: Download ${{ matrix.asset }} from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir dl
          for name in "$ASSET" SHA256SUMS; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$name\") | .id")
            if [ -z "$id" ]; then
              echo "::error::release $RELEASE_ID has no asset $name"
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "dl/$name"
          done
          cd dl
          awk -v n="$ASSET" '$2 == n' SHA256SUMS | sha256sum -c -
          chmod +x "$ASSET"

      - name: oxideclaw --version on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          out=$(docker run --rm --network none -v "$PWD/dl:/dl:ro" "$IMAGE" "/dl/$ASSET" --version)
          echo "$out"
          if [ "$out" != "oxideclaw ${TAG#v}" ]; then
            echo "::error::$ASSET on $IMAGE printed '$out', expected 'oxideclaw ${TAG#v}'"
            exit 1
          fi

  publish:
    needs: [release, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the draft
      actions: write   # dispatch docker.yml
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # A pre-release (hyphenated tag) stays off /releases/latest.
          LATEST=true
          if [[ "$TAG" == *-* ]]; then LATEST=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$LATEST" --jq .html_url

      # A release made with GITHUB_TOKEN triggers no workflows, so start the
      # image build explicitly; the Dockerfile downloads the musl asset,
      # which is public only from this point on.
      - name: Build the Docker image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
            -f version="${TAG#v}"
