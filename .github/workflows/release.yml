name: Release

on:
  push:
    tags:
      - 'v*'          # triggers on v0.1.0, v1.0.0-beta.1, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# Read-only by default: the build jobs run third-party actions, pip packages
# and every crate's build script, none of which should hold a write token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────
          # gnu builds link against a glibc 2.28 floor via cargo-zigbuild
          # (Ubuntu 20.04+, Debian 10+, RHEL 8+). Built against the runner's
          # own glibc they required GLIBC_2.39 and would not start on
          # Ubuntu 22.04, Debian 12 or RHEL 9.
          - target: x86_64-unknown-linux-gnu
            zigtarget: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            artifact: oxideclaw-linux-x64
            cross: false
            zig: true
          - target: aarch64-unknown-linux-gnu
            zigtarget: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            artifact: oxideclaw-linux-arm64
            cross: false
            zig: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: oxideclaw-linux-x64-musl
            cross: true

          # ── macOS ──────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os: macos-14          # Apple Silicon runner (cross-compiles to x86_64)
            artifact: oxideclaw-macos-x64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14          # Apple Silicon runner
            artifact: oxideclaw-macos-arm64
            cross: false

          # ── Windows ────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: oxideclaw-windows-x64.exe
            cross: false

    runs-on: ${{ matrix.os }}
    steps:
      # A manual dispatch runs on whatever branch was picked in the UI; build
      # the requested tag, not that branch's HEAD.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux gnu via cargo-zigbuild (glibc floor in matrix.zigtarget). A
      # venv because the runner's system Python refuses pip installs (PEP 668).
      - name: Install cargo-zigbuild (Linux gnu)
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.16.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      # zigbuild drops the `.2.28` suffix from the output directory, so the
      # binary still lands in target/<triple>/release.
      - name: Build release (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.zigtarget }}

      # Linux musl via cross (pinned so a release does not track git main)
      - name: Install cross (Linux musl)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # Native builds (macOS / Windows)
      - name: Build release (native)
        if: "!matrix.cross && !matrix.zig"
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ──────────────────────────────────────────────
      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/oxideclaw ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      # glibc refuses to load a binary that names any version it lacks, even
      # for weak symbols, so one stray GLIBC_2.39 reference breaks older hosts.
      - name: Check glibc floor (Linux gnu)
        if: matrix.zig
        run: |
          max=$(readelf -V ${{ matrix.artifact }} | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | tail -1)
          echo "highest glibc version required: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" != GLIBC_2.28 ]; then
            echo "::error::${{ matrix.artifact }} requires $max, above the GLIBC_2.28 floor"
            exit 1
          fi

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/oxideclaw.exe" "${{ matrix.artifact }}"

      - name: Generate checksum (unix)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Generate checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write    # gh release create
      actions: write     # gh workflow run docker.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # gh authenticates with GH_TOKEN

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create manifest
        run: |
          cd release
          cat > manifest.json <<'SCRIPT'
          {
            "platforms": {}
          }
          SCRIPT
          # Build proper manifest with jq
          echo '{}' > manifest.json
          for f in oxideclaw-*; do
            [[ "$f" == *.sha256 ]] && continue
            [[ ! -f "${f}.sha256" ]] && continue
            checksum=$(cut -d' ' -f1 < "${f}.sha256")
            jq --arg name "$f" --arg sum "$checksum" \
              '.[$name] = {"checksum": $sum}' manifest.json > tmp.json
            mv tmp.json manifest.json
          done
          # Wrap in platforms key
          jq '{platforms: .}' manifest.json > tmp.json
          mv tmp.json manifest.json
          cat manifest.json

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # --verify-tag: never create a missing tag at the default branch tip.
          gh release create "$TAG" \
            --title "OxideClaw $TAG" \
            --generate-notes \
            --verify-tag \
            release/*
          # A release made with GITHUB_TOKEN triggers no workflows, so start
          # the image build explicitly; the Dockerfile downloads the musl
          # asset, which exists only from this point on.
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
            -f version="${TAG#v}"
