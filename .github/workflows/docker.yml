name: Docker image

# Publishes ghcr.io/forkedintime/oxideclaw:<version> (and :latest unless the
# version is a pre-release such as 1.0.0-beta.1) from the musl release binary.
# release.yml dispatches it once the smoke-tested draft is published; it can
# also be run by hand with a version (e.g. to backfill 0.4.0).
# A `release: published` trigger would never fire: release.yml publishes with
# GITHUB_TOKEN, and events caused by that token do not start workflows (only
# workflow_dispatch / repository_dispatch are exempt).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (e.g. 0.4.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tags="ghcr.io/forkedintime/oxideclaw:$v"
          # A pre-release must not move :latest under stable users.
          [[ "$v" == *-* ]] || tags="$tags,ghcr.io/forkedintime/oxideclaw:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: OXIDECLAW_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/ForkedInTime/OxideClaw
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
