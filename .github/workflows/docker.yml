name: Docker image

# Publishes ghcr.io/forkedintime/oxideclaw:<version> and :latest from the
# musl release binary. Runs when a release is published, or by hand with a
# version (e.g. to backfill 0.4.0).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (e.g. 0.4.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: OXIDECLAW_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/forkedintime/oxideclaw:${{ steps.v.outputs.version }}
            ghcr.io/forkedintime/oxideclaw:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ForkedInTime/OxideClaw
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
